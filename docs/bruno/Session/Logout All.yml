info:
  name: Logout All
  type: http
  seq: 2

http:
  method: DELETE
  url: "{{API-URL}}/v1/auth/sessions"
  headers:
    - name: Authorization
      value: "{{token-type}} {{access-token}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
