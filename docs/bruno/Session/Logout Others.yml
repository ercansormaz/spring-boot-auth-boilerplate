info:
  name: Logout Others
  type: http
  seq: 4

http:
  method: DELETE
  url: "{{API-URL}}/v1/auth/sessions/others"
  headers:
    - name: Authorization
      value: "{{token-type}} {{access-token}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
