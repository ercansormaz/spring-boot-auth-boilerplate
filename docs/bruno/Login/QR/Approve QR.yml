info:
  name: Approve QR
  type: http
  seq: 2

http:
  method: PUT
  url: "{{API-URL}}/v1/auth/qr"
  headers:
    - name: Authorization
      value: "{{token-type}} {{access-token}}"
  body:
    type: json
    data: |-
      {
        "data": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
