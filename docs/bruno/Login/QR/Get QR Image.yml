info:
  name: Get QR Image
  type: http
  seq: 1

http:
  method: GET
  url: "{{API-URL}}/v1/auth/qr"
  params:
    - name: width
      value: "250"
      type: query
      description: Optional
      disabled: true
    - name: height
      value: "250"
      type: query
      description: Optional
      disabled: true
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
          bru.setCollectionVar("qr-id", res.getHeader("x-qr-id"))
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
